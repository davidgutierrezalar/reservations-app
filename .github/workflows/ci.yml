name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Write access only to push the coverage badge branch
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Integration tests use Testcontainers, which runs on the runner's Docker
      - run: sh mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/target/site/jacoco/
      # On main only: draw the coverage badge and keep it on the orphan `badges` branch, so main gets no bot commits
      - uses: cicirello/jacoco-badge-generator@v2
        if: github.ref == 'refs/heads/main'
        with:
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
          badges-directory: badges
      - name: Publish the badge
        if: github.ref == 'refs/heads/main'
        working-directory: badges
        run: |
          git init -q -b badges
          git add jacoco.svg
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Coverage badge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
