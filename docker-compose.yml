services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    # No published port: only the backend reaches it, over the Compose network, so the demo credentials stay private
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: reservas
      DB_PASSWORD: reservas
      # Local demo values; override them through the shell or a .env file
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reservas.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      # Loopback only (Swagger for local use); browsers go through nginx so rate limiting sees their real IP
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
