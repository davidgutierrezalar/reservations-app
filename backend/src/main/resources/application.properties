spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USER:reservas}
spring.datasource.password=${DB_PASSWORD:reservas}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# No default on purpose: the app must not start with a publicly known signing key
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=PT15M
app.jwt.refresh-ttl=P7D
# Browsers accept Secure cookies on http://localhost; set COOKIE_SECURE=false only to test over plain HTTP elsewhere
app.cookie.secure=${COOKIE_SECURE:true}
# Optional: creates this admin on startup if it does not exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Swagger UI sends the XSRF-TOKEN cookie back as a header, so "Try it out" works with cookie auth
springdoc.swagger-ui.csrf.enabled=true

management.endpoints.web.exposure.include=health,info
