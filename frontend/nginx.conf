server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Defense in depth against XSS and clickjacking; everything the SPA loads is served from this origin
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, not append: a client-sent X-Forwarded-For would let it pick its own rate-limit bucket
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Client-side routes (/resources, /reservations) all serve the SPA
    location / {
        try_files $uri /index.html;
    }
}
